name: Evidencija (lovačka udruga)
version: "1.53.0.3"
slug: evidencija
description: Evidencija članova, radnih akcija, članarine i oglasnik za lovačke udruge
url: https://github.com/daxemann/evidencija-addon
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
hassio_api: true
hassio_role: manager
homeassistant_api: true
ports:
  5080/tcp: 5080
ports_description:
  5080/tcp: Web sučelje u lokalnoj mreži
webui: http://[HOST]:[PORT:5080]
watchdog: tcp://[HOST]:[PORT:5080]
options:
  tailscale: true
  tailscale_hostname: evidencija
  tailscale_authkey: ""
  failover: false
  failover_lokacija: ""
  failover_partner: ""
  failover_pocetna_uloga: aktivan
  failover_obavijest: ""
schema:
  tailscale: bool
  tailscale_hostname: str
  tailscale_authkey: password?
  failover: bool
  failover_lokacija: str?
  failover_partner: str?
  failover_pocetna_uloga: list(aktivan|pripravan)
  failover_obavijest: str?
