configuration:
  tailscale:
    name: Internet pristup preko Tailscale Funnel
    description: Aplikacija dobiva vlastitu javnu HTTPS adresu (npr. https://evidencija.<tailnet>.ts.net). Pri prvom pokretanju u zapisniku (Log) se pojavljuje poveznica za prijavu u Tailscale.
  tailscale_hostname:
    name: Naziv uređaja u Tailscaleu
    description: Prvi dio javne adrese.
  tailscale_authkey:
    name: Tailscale auth key (nije obavezno)
    description: Umjesto prijave preko poveznice u zapisniku.
  failover:
    name: Ausfall-Server (Failover)
    description: Zwei Home-Assistant-Standorte teilen sich eine Adresse. Nur für eigene Installationen mit zwei Servern.
  failover_lokacija:
    name: Standort (z. B. HR oder DE)
    description: Kurzname dieses Servers.
  failover_partner:
    name: Partner-Steuerknoten
    description: Tailscale-Name des Steuerknotens des anderen Servers, z. B. evidencija-ctl-de.
  failover_pocetna_uloga:
    name: Startrolle
    description: aktivan = betreibt die Adresse, pripravan = Standby. Nur beim allerersten Start.
  failover_obavijest:
    name: Benachrichtigung
    description: Notify-Dienst für Meldungen, z. B. notify.mobile_app_handy (leer = nur HA-Meldung).
network:
  5080/tcp: Web sučelje u lokalnoj mreži
