# Failover: Wartungsseite, solange /run/evidencija/wartung existiert (Standby oder Wechsel).
# Ohne aktivierten Failover existiert die Datei nie – dann ändert sich nichts.
Alias /__fo_wartung.html /failover/wartung.html
<Directory /failover>
    Require all granted
</Directory>
ErrorDocument 503 /__fo_wartung.html
RewriteEngine On
RewriteCond /run/evidencija/wartung -f
RewriteCond %{REQUEST_URI} !=/__fo_wartung.html
RewriteRule ^ - [R=503,L]
